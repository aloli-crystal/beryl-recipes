recipe: clamav
description: |
  Antivirus ClamAV pour le SCAN À LA DEMANDE (ex. vérifier un fichier
  uploadé avant de l'accepter). Le démon `clamd` garde la base en RAM →
  chaque scan est instantané ; l'app envoie le fichier au socket clamd.
  `freshclam` met la base à jour automatiquement.

  Le socket est ouvert au groupe de l'app (param `socket_group`, défaut
  `www`) → le user applicatif peut scanner sans être root ni clamav.

  Côté app, scanner un fichier :
    clamdscan --fdpass --no-summary <fichier>
  Code retour : 0 = sain, 1 = infecté, 2 = erreur. `--fdpass` passe le
  descripteur de fichier à clamd (pas de souci de permission sur le
  fichier temporaire de l'upload). Côté Ruby : gem `clamby` (wrappe
  clamdscan) ou `clamav-client` (parle le protocole sur le socket).

  Configs minimales sans la ligne `Example` (qui bloquerait les démons).
parameters:
  socket_group:
    type: string
    default: www
    description: Groupe autorisé à parler au socket clamd (= groupe de l'app).
steps:
  - pkg-install:
      packages: [clamav]
  - file-write:
      path: /usr/local/etc/freshclam.conf
      mode: "0644"
      content: |
        DatabaseDirectory /var/db/clamav
        DatabaseMirror database.clamav.net
  # clamd.conf géré par directives (additif) → la recette clamav-tcp peut
  # ajouter TCPSocket/TCPAddr sans réécrire toute la conf ni flapper.
  - clamd-config-set: { key: DatabaseDirectory, value: /var/db/clamav }
  - clamd-config-set: { key: LocalSocket, value: /var/run/clamav/clamd.sock }
  - clamd-config-set: { key: LocalSocketGroup, value: "{{ socket_group }}" }
  - clamd-config-set: { key: LocalSocketMode, value: "660" }
  - freshclam: {} # base virale initiale (clamd en a besoin pour démarrer)
  - service-enable:
      name: clamav_freshclam # scripts rc FreeBSD en underscore (pas tiret)
      start: true
  - service-enable:
      name: clamav_clamd
      start: true
