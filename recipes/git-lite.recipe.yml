recipe: git-lite
description: |
  Installe `git-lite` (devel/git@lite) À LA PLACE du `git` complet : même
  commande `git` (clone, fetch, push en https/ssh), sans les dépendances
  Python et Perl (ni interface graphique, ni git-svn, ni git-p4).

  POURQUOI : `git` tire python3xx et perl5 (+ p5-Authen-SASL…) que rien
  d'autre n'utilise sur un serveur. Leurs avis vuxml s'accumulent dans le
  rapport quotidien de sécurité, dont certains SANS correctif (`>= 0` :
  imaplib/poplib de Python, 13 oct. 2026) — la seule issue est de ne plus
  les avoir installés. Les recettes qui ont besoin de git (`base-packages`,
  `headscale-*`, `oh-my-zsh`) requièrent celle-ci au lieu d'installer `git`.

  TRANSITION : `git` et `git-lite` fournissent tous deux /usr/local/bin/git
  (conflit) → `git` est d'abord retiré, puis `git-lite` installé (quelques
  secondes sans git). Si un paquet dépend de `git`, `pkg delete` le retire
  aussi : vérifiez le dry-run. Les dépendances devenues orphelines (python3xx,
  perl5, p5-*) sont retirées par la recette générale `pkg-autoremove`.

  LINUX (SUSE) : l'équivalent est `git-core` (git sans Perl ni Python) ;
  rien n'est retiré.
systems: [freebsd, linux]
steps:
  - pkg-remove:
      packages: [git]
      systems: freebsd

  - pkg-install:
      packages: [git-lite]
      systems: freebsd

  - pkg-install:
      packages: [git-core]
      systems: linux
