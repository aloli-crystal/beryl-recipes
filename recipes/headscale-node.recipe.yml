recipe: headscale-node
description: |
  Joint un host au mesh Headscale géré par `headscale.aloli.net`. Cette
  recette transforme un host beryl en *node* du mesh : tailscaled est
  installé, activé, et fait son `tailscale up` une fois (idempotent).

  Pré-requis :
  * Une pre-auth key Headscale existe (générée côté serveur via
    `headscale preauthkeys create --user beryl --reusable=false`) et
    est exposée à l'apply via la variable d'env `HEADSCALE_AUTHKEY`.
    L'usage standard : stocker la clé dans le coffre `secrets` de la
    société (cf. `beryl env edit aloli`), beryl l'injecte dans ENV
    via `EnvFile#apply_to_env(account, "headscale")` au moment de
    l'apply.

  Pour un node CI (GitHub Actions, GitLab CI), utiliser plutôt le
  workflow ephemeral décrit dans `doc/headscale-setup.adoc` §CI :
  c'est le runner lui-même qui fait `tailscale up --ephemeral`, pas
  besoin d'apply beryl.

  Cf. memory ALOLI `roadmap_beryl_headscale.md` Phase 2.

requires:
  - base-packages

steps:
  - pkg-install:
      packages: [tailscale]

  - service-enable:
      name: tailscaled

  - headscale-join:
      login_server: https://headscale.aloli.net
      authkey_env_var: HEADSCALE_AUTHKEY
      ephemeral: false
