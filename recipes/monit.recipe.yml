recipe: monit
description: |
  Supervision légère via `monit` : surveille le DISQUE (la hantise —
  alerte AVANT le « disque plein »), la mémoire, le swap, relance `sshd` et
  `cron` s'ils tombent. Les autres recettes ajoutent leurs sondes dans
  `/usr/local/etc/monit.d/` : état des pools ZFS + santé SMART avec
  `zfs-scrub` (à appliquer AVEC monit — elle l'exige d'ailleurs),
  nginx/HTTPS avec `static-site-https`. Alerte par mail vers `alert_email`.

  UN MAIL = UNE ACTION À FAIRE. Liste BLANCHE d'événements (ressources,
  connexion, contrôle, relance en échec) ; tout le reste ne va qu'au syslog :
  service tombé puis relancé avec succès (monit a déjà réparé), changement
  de PID, (re)démarrage de monit à chaque apply. Un service vital n'alerte
  que s'il ne revient PAS (3 relances en 5 contrôles → monit abandonne et
  prévient — règle reprise par chaque sonde de processus, nginx compris) ou si son script de démarrage échoue. Pas de sonde
  de charge : une charge haute sans autre symptôme n'appelle aucune action,
  et ses effets réels (swap, site lent ou injoignable) ont leur sonde.

  Un contrôle par MINUTE (`poll_interval: 60`) : un service relancé l'est en
  moins d'une minute. Les seuils de mémoire et swap exigent 7 contrôles
  consécutifs (~7 min) pour ignorer les pics brefs.

  monit envoie ses alertes en SMTP direct via le smarthost (mêmes
  paramètres que `smtp-relay`). Le COUPLE [utilisateur, mot de passe] vient
  du COFFRE (`SMTP_RELAY_USER` + `SMTP_RELAY_PASSWORD`), injecté par
  `secret-file` → jamais dans git. monitrc est en 0600 (monit refuse un
  control file plus permissif que 0700). Le couple est donc écrit dans 2
  fichiers 0600 (auth.conf de dma + monitrc), alimentés par les MÊMES
  variables du coffre.

  CLI : `monit status` / `monit summary` (via socket Unix local — aucun
  port réseau ouvert). Seuils ajustables par paramètres.

  Mails en français : objet `[monit][<fqdn>] <service> · <catégorie> ·
  <état>` (catégorie française — ressources, connexion, contrôle, relance
  en échec ; l'état reste celui de
  monit, en anglais, car monit n'est pas traduit) et corps en français
  (l'objet repris en première ligne — lisible même quand la messagerie
  n'affiche que le corps —, puis serveur, service, événement, action,
  date, détail). Le FQDN entre
  crochets permet de trier par serveur dans la messagerie.

  Sur ZFS, vérifier `/` suffit à détecter le pool plein (tous les datasets
  partagent l'espace libre du pool).

  PRÉ-REQUIS — même config mail que smtp-relay dans le coffre :

    beryl env edit <société>
      [mail]
      SMTP_RELAY_USER     = 'relay@example.com'
      SMTP_RELAY_PASSWORD = 'le-mot-de-passe'
      SMTP_RELAY_TO       = 'you@example.com'

  Déclaration — la recette est NUE (tout vient du coffre) :

    apply_recipes:
      - monit

  Surcharge de la destination (cas à plusieurs adresses) :

    apply_recipes:
      - monit: autre@example.com
positional: alert_email
parameters:
  smarthost:
    type: string
    default: "ssl0.ovh.net"
    description: SMTP de sortie du fournisseur (smarthost).
  smarthost_port:
    type: string
    default: "587"
    description: Port submission (587 = STARTTLS).
  alert_email:
    type: string
    default: ""
    from_env: SMTP_RELAY_TO
    description: Destination des alertes. Défaut = `SMTP_RELAY_TO` du coffre ; surchargeable.
  disk_threshold:
    type: string
    default: "80"
    description: Seuil d'alerte d'occupation disque ET inodes (%).
  poll_interval:
    type: string
    default: "60"
    description: Intervalle de contrôle monit (secondes) — aussi le délai maximal avant relance d'un service tombé.
steps:
  - pkg-install:
      packages: [monit]
  # Dossier des sondes déposées par les autres recettes : créé ici pour que
  # l'`include` de monitrc ne lève pas d'avertissement tant qu'il est vide.
  - directory:
      path: /usr/local/etc/monit.d
      mode: "0700"
  # monitrc contient la paire SMTP → secret-file (0600), valeurs du coffre.
  - secret-file:
      path: /usr/local/etc/monitrc
      mode: "0600"
      env:
        "@@USER@@": SMTP_RELAY_USER
        "@@SECRET@@": SMTP_RELAY_PASSWORD
      content: |
        # Géré par beryl (recette monit).
        set daemon {{ poll_interval }}
          with start delay 30
        set log syslog

        set mailserver {{ smarthost }} port {{ smarthost_port }}
          username "@@USER@@" password "@@SECRET@@"
          using tlsv12

        # Mails en FRANÇAIS. monit n'est pas traduit : $EVENT (« Resource
        # limit matched », « Connection succeeded »…), $ACTION et $DESCRIPTION
        # restent en anglais ; on écrit le cadre en français et une CATÉGORIE
        # française dans l'objet. Catégorie NEUTRE : un même type d'événement
        # sert à la panne ET au rétablissement, c'est $EVENT qui dit l'état.
        #
        # LISTE BLANCHE : un mail = une action à faire. Les événements absents
        # ci-dessous ne vont qu'au syslog — nonexist (service tombé : monit le
        # relance seul), pid/ppid (PID changé après relance), instance
        # (démarrage/rechargement de monit, à chaque apply), action…
        set alert {{ alert_email }} on { resource } with mail-format {
          from:    @@USER@@
          subject: [monit][{{ fqdn }}] $SERVICE · ressources · $EVENT
          message: [monit][{{ fqdn }}] $SERVICE · ressources · $EVENT

        Serveur    : {{ fqdn }}
        Service    : $SERVICE
        Événement  : $EVENT
        Action     : $ACTION
        Date       : $DATE

        Détail (monit, en anglais) :
        $DESCRIPTION
        }
        set alert {{ alert_email }} on { connection } with mail-format {
          from:    @@USER@@
          subject: [monit][{{ fqdn }}] $SERVICE · connexion · $EVENT
          message: [monit][{{ fqdn }}] $SERVICE · connexion · $EVENT

        Serveur    : {{ fqdn }}
        Service    : $SERVICE
        Événement  : $EVENT
        Action     : $ACTION
        Date       : $DATE

        Détail (monit, en anglais) :
        $DESCRIPTION
        }
        set alert {{ alert_email }} on { status } with mail-format {
          from:    @@USER@@
          subject: [monit][{{ fqdn }}] $SERVICE · contrôle · $EVENT
          message: [monit][{{ fqdn }}] $SERVICE · contrôle · $EVENT

        Serveur    : {{ fqdn }}
        Service    : $SERVICE
        Événement  : $EVENT
        Action     : $ACTION
        Date       : $DATE

        Détail (monit, en anglais) :
        $DESCRIPTION
        }
        # timeout = « N relances en M contrôles » atteint (monit abandonne) ;
        # exec = le script de démarrage/arrêt ou la sonde n'a pas pu s'exécuter.
        set alert {{ alert_email }} on { timeout, exec } with mail-format {
          from:    @@USER@@
          subject: [monit][{{ fqdn }}] $SERVICE · relance en échec · $EVENT
          message: [monit][{{ fqdn }}] $SERVICE · relance en échec · $EVENT

        Serveur    : {{ fqdn }}
        Service    : $SERVICE
        Événement  : $EVENT
        Action     : $ACTION
        Date       : $DATE

        Le service ne revient pas malgré les relances : intervention requise.

        Détail (monit, en anglais) :
        $DESCRIPTION
        }

        set httpd unixsocket /var/run/monit.sock
          allow localhost

        check system $HOST
          if memory usage > 85% for 7 cycles then alert
          if swap usage   > 50% for 7 cycles then alert

        # Services vitaux : relancés SANS mail s'ils tombent ; alerte
        # seulement s'ils ne reviennent pas. Sans sshd, plus aucun accès au
        # serveur ; sans cron, plus de tâches planifiées (scrubs,
        # renouvellement des certificats, rapports…).
        check process sshd with pidfile /var/run/sshd.pid
          start program = "/usr/sbin/service sshd start"
          stop program  = "/usr/sbin/service sshd stop"
          if 3 restarts within 5 cycles then unmonitor

        check process cron with pidfile /var/run/cron.pid
          start program = "/usr/sbin/service cron start"
          stop program  = "/usr/sbin/service cron stop"
          if 3 restarts within 5 cycles then unmonitor

        check filesystem rootfs with path /
          if space usage > {{ disk_threshold }}% then alert
          if inode usage > {{ disk_threshold }}% then alert

        # Checks additionnels déposés par d'autres recettes (ex. zfs-scrub).
        # Le dossier est créé par cette recette ; un glob vide est toléré.
        include /usr/local/etc/monit.d/*.conf
  - service-enable:
      name: monit
      start: true
  # Nouvelle conf prise en compte seulement si elle a changé (un
  # rechargement ne coûte rien, mais inutile s'il n'y a rien de neuf).
  - service-reload:
      name: monit
      if_changed: true
      deferred: true
