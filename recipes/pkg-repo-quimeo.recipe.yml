recipe: pkg-repo-quimeo
description: |
  Enrôle le dépôt pkg PRIVÉ `quimeo` (construit par poudriere sur le builder
  pkg, signé, servi sur le vRack en HTTP). Pose la clé PUBLIQUE de signature +
  la config de dépôt. Idempotent (deux file-write).

  Priorité 10 > dépôts officiels (priorité 0) : en modèle A (overlay), `quimeo`
  ne contient QUE l'EOL/custom (openssl111, ruby27, nginx+passenger…) → ces
  paquets-là viennent de chez nous, tout le reste reste officiel.

  `requires: vrack-interface` : le client doit être sur le vRack pour joindre
  le builder (`192.168.42.4`). L'URL est l'IP vRack du builder (fixe) ; elle
  pourra devenir `pkg.vrack.quimeo.net` une fois le DNS interne (unbound-vrack)
  validé in vivo.

  ⚠️ Si la clé de signature du dépôt tourne, mettre à jour le bloc `content`
  de la clé ci-dessous (procédure de rotation, cf. spec §4).
requires:
  - vrack-interface
steps:
  - file-write:
      path: /usr/local/etc/ssl/certs/quimeo.cert
      mode: "0644"
      content: |
        -----BEGIN PUBLIC KEY-----
        MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAz4LVm4uhADu8k8MDmJpR
        Ga+COsHyC3RbrKvOqDNQLRJ3V7Ai6EwepDkOVzRub/DVeIHkLJAh/0W92txqmbpR
        F0e42HUqIRTMXa23AMLhnDiWPVnJVz+w4+hyiuL9Gd3lMVDPrDKuVLlLeI3r5tJ4
        YvC7zZ59f7b5gRfmpaGry920ib05EiVvVRzh2tdKM8jo/K02pwtsyzuuy3fx4xMZ
        TVyZNG5sTre/ZvSx0FdJ1trLSbraP3ze8S8NMc7tPfut1CUZK3LfpQBLLvul3wHg
        WX+TxdcmfzgV01Ftxtnm058tmd+Lz59cEtky2EXhZcqbYlvz7eDgc8deKS26GQ8X
        5UAGiUgNHniTtqnWJMmSt/nQYQSbubeYtBvA9O4BeArgu5KdwNSxlY32eN9+tOvk
        tljZRKSrWi06aWXH9WbVWvHYxzGCW2oBRT6gC9wgIP1lKG61iDHZ6poPhkHYKMQS
        8z5DR+0iKFJ2+UIv1BCzMJh9fdef6xR5K+eq/fO7VdpA6Fzemo2m/8ngLf3NpJnb
        rzDuW1vYpwWkOyNPE1MI9UoClpsnXVuUNVfJF5FsTc3cPZ0yR0axS/wLzmqAhoZf
        yaUtEeUTMqxCr7SqSsCKOwfQwEh3thxHhPQz7KWlPTOJNhIIpeB2YCYJtrWhP1P8
        tZFmVBfFp5Hn/5kYoOKg60kCAwEAAQ==
        -----END PUBLIC KEY-----
  - file-write:
      path: /usr/local/etc/pkg/repos/quimeo.conf
      mode: "0644"
      content: |
        quimeo: {
          url: "http://192.168.42.4/fbsd150amd64-default",
          signature_type: "pubkey",
          pubkey: "/usr/local/etc/ssl/certs/quimeo.cert",
          enabled: yes,
          priority: 10
        }
