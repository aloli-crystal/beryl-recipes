recipe: post-install
description: Post-install Aloli minimal pour FreeBSD (recette agrégat).
requires:
  - freebsd-updates
  - base-packages
  - shell-tools
  - ssh-hardening
# Pas de steps : tout est dans les requires. beryl résout l'ordre
# topologique (base-packages avant shell-tools, etc.) et applique.
# Le pare-feu (firewall-pf) n'est PAS inclus par défaut : il prend la
# main sur /etc/pf.conf et est laissé en opt-in explicite par host.
