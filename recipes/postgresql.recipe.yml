recipe: postgresql
description: |
  Installe, initialise et démarre PostgreSQL. `version` = numéro de
  version FreeBSD (ex. `16`, `17`) ou `latest` (défaut). Par défaut
  installe `server` ET `client` ; `only: server` (ou `client`) pour
  restreindre. `initdb` est lancé avant le start (idempotent) — PostgreSQL
  l'exige, contrairement à MariaDB.

  INTÉGRITÉ — `--data-checksums` est activé par défaut (`initdb_flags`).
  Chaque page de données porte alors un checksum vérifié à chaque lecture :
  une page corrompue (bit-flip en RAM avant écriture, ou pourriture disque)
  est DÉTECTÉE au lieu d'être servie en silence. Indispensable sur un parc
  à mémoire DDR5 On-Die ECC (sans ECC sideband) — cf. recette `zfs-scrub`
  pour le pendant côté ZFS.

  ATTENTION : `--data-checksums` n'agit qu'à l'`initdb` (cluster NEUF). Sur
  un cluster DÉJÀ initialisé sans checksums, activez-les hors-ligne avec
  `pg_checksums --enable -D <datadir>` (serveur arrêté).
parameters:
  version:
    type: string
    default: latest
    description: Numéro de version FreeBSD (ex. 17) ou `latest`.
  only:
    type: string
    default: ""
    description: "`server` ou `client` pour restreindre ; vide = les deux."
  initdb_flags:
    type: string
    default: "--encoding=utf-8 --lc-collate=C --data-checksums"
    description: >-
      Flags passés à `initdb` via `postgresql_initdb_flags`. Défaut =
      défaut FreeBSD + `--data-checksums` (détection de corruption de page).
steps:
  - pkg-versioned:
      base: postgresql
      version: "{{ version }}"
      only: "{{ only }}"
  # Doit précéder `postgresql-initdb` : `service postgresql initdb` lit
  # `postgresql_initdb_flags` dans rc.conf. Sur un client-only (initdb
  # skippé), la variable reste simplement inerte.
  - sysrc-set:
      key: postgresql_initdb_flags
      value: "{{ initdb_flags }}"
  - postgresql-initdb: {} # se skippe si pas de serveur (only: client)
  - service-enable:
      name: postgresql
      start: true
      if_present: true # only: client → pas de serveur → skippé
