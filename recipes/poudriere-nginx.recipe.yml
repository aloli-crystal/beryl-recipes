recipe: poudriere-nginx
description: |
  Sert le dépôt poudriere d'un builder de paquets : SON fichier
  `/usr/local/etc/nginx/conf.d/poudriere.conf` (nginx.conf appartient à
  `nginx-lite`) expose DEUX faces du même dépôt (même sortie, même
  signature ; seuls le nom et le transport changent) :

  * face PRIVÉE vRack (HTTP), sur `{{ vrack_ip }}` UNIQUEMENT ;
  * face PUBLIQUE (HTTPS), `server_name {{ public_domain }}` — les clients
    pointent `https://{{ public_domain }}/${ABI}`.

  L'URL `${ABI}` (que `pkg` détend en `FreeBSD:15:amd64`) est aliasée sur le
  SYMLINK `FreeBSD:15:amd64` que `poudriere-build` entretient vers le set de
  la dernière mineure ; pour FreeBSD 16, ajouter un `location` jumeau.

  Certificat Let's Encrypt validé par DNS-01 (plugin acme.sh `dns_ovh`,
  identifiants OVH du coffre de la société), conventions du port acme.sh
  (recette `acme`) : aucune coupure, aucun geste manuel. Durci comme
  `static-site-https` (GET/HEAD seulement, fichiers cachés refusés, HSTS) ;
  nom inconnu → serveurs par défaut de nginx-lite.

  Tout ce qui est propre au déploiement est un PARAMÈTRE : `public_domain`,
  `vrack_server_name`. Une société peut surcharger la recette (plusieurs noms
  publics, mode alias DNS…) dans `<société>/recipes/`.

  Supervision (inerte tant que monit n'est pas installé) : alerte si le dépôt
  ne répond plus en HTTPS (requête sur `meta.conf`) ou si le certificat
  expire dans moins de 14 jours.
parameters:
  public_domain: {}
  vrack_server_name: {}
requires:
  - acme
  - nginx-lite
  - vrack-interface
steps:
  # Certificat AVANT la conf (nginx refuserait une conf sans certificat).
  - acme-cert:
      domains: ["{{ public_domain }}"]
      method: dns
      dns_provider: dns_ovh
      reloadcmd: "/usr/local/bin/sudo /usr/sbin/service nginx reload"
  - file-write:
      path: /usr/local/etc/nginx/conf.d/poudriere.conf
      mode: "0644"
      content: |
        # Géré par beryl (recette poudriere-nginx). Le :80 public (défis ACME,
        # redirection HTTPS) est le serveur par défaut de nginx-lite.

        # Face PRIVÉE vRack (HTTP) : seul serveur sur cette adresse.
        server {
            listen      {{ vrack_ip }}:80;
            server_name {{ vrack_server_name }};

            root      /usr/local/poudriere/data/packages;
            autoindex on;
            client_max_body_size 1k;

            location / {
                limit_except GET { deny all; }
            }
        }

        # Face PUBLIQUE (HTTPS).
        server {
            listen      443 ssl;
            listen      [::]:443 ssl;
            server_name {{ public_domain }};

            ssl_certificate     /var/db/acme/certs/{{ public_domain }}_ecc/fullchain.cer;
            ssl_certificate_key /var/db/acme/certs/{{ public_domain }}_ecc/{{ public_domain }}.key;

            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            client_max_body_size 1k;

            location ~ /\. {
                return 404;
            }

            # URL pérenne : alias du SYMLINK entretenu par poudriere-build.
            location /FreeBSD:15:amd64/ {
                alias     "/usr/local/poudriere/data/packages/FreeBSD:15:amd64/";
                autoindex on;
                limit_except GET { deny all; }
            }

            location / {
                return 404;
            }
        }
  - service-reload:
      name: nginx
      if_changed: true
  - file-write:
      path: /usr/local/etc/monit.d/poudriere-repo.conf
      mode: "0600"
      content: |
        # Géré par beryl (recette poudriere-nginx).
        check host poudriere-repo with address {{ public_domain }}
          if failed port 443 protocol https
             request "/FreeBSD:15:amd64/meta.conf"
             and certificate valid > 14 days
             for 7 cycles then alert
  - service-reload:
      name: monit
      if_changed: true
      deferred: true
