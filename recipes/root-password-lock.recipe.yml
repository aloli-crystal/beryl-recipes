recipe: root-password-lock
description: |
  Verrouille le MOT DE PASSE des comptes d'UID 0 (`root`, `toor`) : champ
  du mot de passe à `*` (aucun mot de passe ne correspond).

  POURQUOI : une installation FreeBSD laisse `root` SANS mot de passe (champ
  vide, signalé par le rapport quotidien « Checking for passwordless
  accounts ») → tout membre de `wheel` devient root par `su` sans rien taper.

  CE QUI RESTE POSSIBLE :
  * `sudo` (il demande le mot de passe de l'appelant, ou aucun avec
    NOPASSWD) — `sudo -i` / `sudo su -` remplacent `su` ;
  * SSH root PAR CLÉ (porte de secours du profil chiffré) : `*` n'est PAS
    `*LOCKED*` (que `pw lock` poserait et que sshd refuse même par clé) ;
  * console : mode mono-utilisateur (console `secure` dans /etc/ttys, défaut).

  Idempotent : un mot de passe qui commence déjà par `*` (`*` ou `*LOCKED*`
  posé volontairement) est laissé tel quel ; un compte absent est ignoré.
steps:
  # Lignes au MÊME niveau d'indentation : le bloc `>-` les joint en UNE ligne.
  # Indentées, elles garderaient leurs retours à la ligne, et le shell de
  # connexion (csh chez admin) qui lit `sudo sh -c '…'` les refuse.
  - command:
      run: >-
        for u in root toor; do
        pw usershow "$u" >/dev/null 2>&1 || continue;
        case "$(pw usershow "$u" | cut -d: -f2)" in
        '*'*) ;;
        *) echo '*' | pw usermod "$u" -H 0 && echo "$u : mot de passe verrouillé" ;;
        esac;
        done
      unless: >-
        for u in root toor; do
        pw usershow "$u" >/dev/null 2>&1 || continue;
        case "$(pw usershow "$u" | cut -d: -f2)" in '*'*) ;; *) exit 1 ;; esac;
        done
      show_output: true
