recipe: ruby27-aloli
description: |
  Pose Ruby 2.7.8 (build interne Aloli, patché FreeBSD 15 + lié openssl111)
  dans /opt/rubies/ruby-2.7.8, depuis le dépôt pkg PRIVÉ signé `aloli`.
  Remplace la compilation par host (ruby-install) : build UNE fois sur han,
  déployé en pkg binaire sur toute la flotte (~20 serveurs).

  Pourquoi un dépôt privé : openssl111 est déprécié (retrait upstream après
  2026-04-30) — on le FIGE dans notre dépôt pour que toute (ré)install reste
  possible sur la fenêtre 6–12 mois. Le ruby et l'openssl viennent donc tous
  deux du dépôt `aloli`, en priorité sur les ports FreeBSD.

  TRANSITOIRE : retirer cette recette (et le dépôt) une fois la migration
  hors Ruby 2.7 terminée. Production des paquets : tools/ruby27-pkg/.
requires:
  - chruby
parameters:
  repo_url:
    type: string
    default: "https://pkg.aloli.fr/freebsd15"
    description: URL HTTPS du dépôt pkg privé Aloli.
steps:
  # 1. Clé publique de vérification du dépôt signé.
  #    >>> COLLER ICI la clé générée par 02-build-repo.sh (keys/aloli-pkg.pub) <<<
  - file-write:
      path: /usr/local/etc/pkg/keys/aloli-pkg.pub
      mode: "0644"
      owner: root:wheel
      content: |
        -----BEGIN PUBLIC KEY-----
        REMPLACER_PAR_LA_CLE_PUBLIQUE_ALOLI
        -----END PUBLIC KEY-----
  # 2. Déclaration du dépôt privé (prioritaire sur FreeBSD-ports).
  - file-write:
      path: /usr/local/etc/pkg/repos/aloli.conf
      mode: "0644"
      owner: root:wheel
      content: |
        aloli: {
          url: "{{ repo_url }}",
          mirror_type: "none",
          signature_type: "pubkey",
          pubkey: "/usr/local/etc/pkg/keys/aloli-pkg.pub",
          enabled: yes,
          priority: 100
        }
  # 3. Installation. pkg récupère le catalogue du nouveau dépôt à la 1re install ;
  #    openssl111 est tiré du dépôt `aloli` (figé) grâce à priority: 100.
  - pkg-install:
      packages: [openssl111, ruby27-aloli]
