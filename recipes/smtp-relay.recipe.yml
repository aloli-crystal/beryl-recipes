recipe: smtp-relay
description: |
  Relais SMTP sortant via `dma` (DragonFly Mail Agent), le MTA PAR DÉFAUT du
  système de base depuis FreeBSD 14 — aucun paquet installé, conventions du
  système (/etc/dma/, /etc/mail/mailer.conf, /etc/mail/aliases). Un MTA
  send-only minuscule qui relaie TOUT le courrier local (cron,
  root, système, ET tous les utilisateurs via l'alias attrape-tout `*`) vers
  un smarthost authentifié → vous recevez enfin la
  sortie des crons et les alertes. AUCUN démon en écoute (rien à durcir
  côté réseau).

  TOUTE la config mail vient du COFFRE de la société, jamais en clair dans la
  recette ni dans git : le COUPLE [utilisateur, mot de passe] (`SMTP_RELAY_USER`
  + `SMTP_RELAY_PASSWORD`, injecté par `secret-file`) ET la DESTINATION
  (`SMTP_RELAY_TO`, via `from_env`). Du coup la recette s'utilise NUE.

  Smarthost OVH par défaut (`ssl0.ovh.net:587`, STARTTLS). OVH exige que le
  `From` soit le compte authentifié → `MASQUERADE` réécrit tout l'envoi vers
  `SMTP_RELAY_USER`.

  SANS mot de passe (relais interne qui accepte selon l'adresse IP, ex. le
  relais d'un client sur le port 25 ; mot de passe absent ou vide pour ce
  serveur, `<SERVEUR>__SMTP_RELAY_PASSWORD = ''`) : pas d'authentification,
  TLS seulement si le relais le propose (`OPPORTUNISTIC_TLS`).

  PRÉ-REQUIS — poser la config mail dans le coffre AVANT l'apply :

    beryl env edit <société>
      [mail]
      SMTP_RELAY_USER     = 'relay@example.com'   # compte d'auth (chez OVH)
      SMTP_RELAY_PASSWORD = 'le-mot-de-passe'
      SMTP_RELAY_TO       = 'you@example.com'    # où VOUS lisez le courrier

  Déclaration — la recette est NUE (tout vient du coffre) :

    apply_recipes:
      - smtp-relay

  Surcharge de la destination (cas à PLUSIEURS adresses) — forme positionnelle :

    apply_recipes:
      - smtp-relay: autre@example.com
positional: alert_email
parameters:
  smarthost:
    type: string
    default: "ssl0.ovh.net"
    description: SMTP de sortie du fournisseur (smarthost).
  smarthost_port:
    type: string
    default: "587"
    description: Port submission (587 = STARTTLS).
  alert_email:
    type: string
    default: ""
    from_env: SMTP_RELAY_TO
    description: Destination du courrier. Défaut = `SMTP_RELAY_TO` du coffre ; surchargeable.
steps:
  # dma du SYSTÈME DE BASE (MTA par défaut depuis FreeBSD 14) : config dans
  # /etc/dma/, mêmes droits que le système (root:mail, 0640 — dma tourne en
  # setgid mail et doit pouvoir lire auth.conf). Aucun paquet à installer.
  # Le compte (MASQUERADE) vient du coffre → secret-file injecte @@USER@@.
  - secret-file:
      path: /etc/dma/dma.conf
      owner: "root:mail"
      mode: "0640"
      if_secret: SMTP_RELAY_PASSWORD
      env:
        "@@USER@@": SMTP_RELAY_USER
      content: |
        # Géré par beryl (recette smtp-relay) — cf. dma.conf(5).
        SMARTHOST {{ smarthost }}
        PORT {{ smarthost_port }}
        AUTHPATH /etc/dma/auth.conf
        SECURETRANSFER
        STARTTLS
        MASQUERADE @@USER@@
  # Relais sans authentification : TLS tenté, envoi en clair si le relais
  # ne le propose pas.
  - secret-file:
      path: /etc/dma/dma.conf
      owner: "root:mail"
      mode: "0640"
      unless_secret: SMTP_RELAY_PASSWORD
      env:
        "@@USER@@": SMTP_RELAY_USER
      content: |
        # Géré par beryl (recette smtp-relay) — cf. dma.conf(5). Relais sans authentification.
        SMARTHOST {{ smarthost }}
        PORT {{ smarthost_port }}
        SECURETRANSFER
        STARTTLS
        OPPORTUNISTIC_TLS
        MASQUERADE @@USER@@
  # La paire [user, password] du coffre.
  - secret-file:
      path: /etc/dma/auth.conf
      owner: "root:mail"
      mode: "0640"
      if_secret: SMTP_RELAY_PASSWORD
      env:
        "@@USER@@": SMTP_RELAY_USER
        "@@SECRET@@": SMTP_RELAY_PASSWORD
      content: |
        @@USER@@|{{ smarthost }}:@@SECRET@@
  # mailwrapper → dma : copie de l'exemple fourni par le système
  # (/usr/share/examples/dma/mailer.conf).
  - file-write:
      path: /etc/mail/mailer.conf
      mode: "0644"
      content: |
        #
        # mailer.conf for use with dma(8)
        #
        # If sendmail is configured, an example of mailer.conf that uses sendmail
        # instead can be found in /usr/share/examples/sendmail.

        sendmail	/usr/libexec/dma
        mailq		/usr/libexec/dma
        newaliases	/usr/libexec/dma
  # Alias dans le fichier du système (/etc/aliases n'en est qu'un lien) : on
  # ne touche QUE nos lignes, les alias système (postmaster, abuse…) restent.
  # `root` → votre boîte ; `*` = alias attrape-tout de dma (dma(8), ALIASES) :
  # tout utilisateur local sans alias (admin, deploy, comptes futurs) aussi.
  - line-in-file:
      path: /etc/mail/aliases
      match: '^root:'
      line: "root: {{ alert_email }}"
  - line-in-file:
      path: /etc/mail/aliases
      match: '^\*:'
      line: "*: {{ alert_email }}"
  # sendmail coupé (Handbook, « Changing the Mail Transfer Agent »).
  - sysrc-set: { key: sendmail_enable, value: "NONE" }
  - sysrc-set: { key: sendmail_submit_enable, value: "NO" }
  - sysrc-set: { key: sendmail_outbound_enable, value: "NO" }
  - sysrc-set: { key: sendmail_msp_queue_enable, value: "NO" }
