recipe: sshd-auth-keys-only
description: |
  Authentification SSH par clé uniquement (jamais de mot de passe).

  Connexion root : COUPÉE (`PermitRootLogin no`) — beryl passe par
  l'utilisateur d'administration et sudo, rien ne se connecte en root à un
  serveur installé. Exception, calculée par beryl (`{{ root_ssh_login }}`,
  même règle que le bootstrap) : `/home` chiffré (profil `standard` du pool
  boot) → root PAR CLÉ (`prohibit-password`), porte de secours tant que les
  datasets chiffrés ne sont pas déverrouillés. Requiert beryl >= 0.6.58.
systems: [freebsd, linux]
parameters:
  permit_root_login:
    type: string
    default: "{{ root_ssh_login }}"
    description: |
      Valeur de PermitRootLogin. Par défaut celle calculée par beryl (`no`, ou
      `prohibit-password` avec /home chiffré) ; à ne surcharger qu'en
      connaissance de cause.
steps:
  - sshd-config-set:
      key: PermitRootLogin
      value: "{{ permit_root_login }}"
  - sshd-config-set:
      key: PasswordAuthentication
      value: "no"
  - sshd-config-set:
      key: KbdInteractiveAuthentication
      value: "no"
  - sshd-config-set:
      key: PermitEmptyPasswords
      value: "no"
  - sshd-config-set:
      key: X11Forwarding
      value: "no"
