recipe: sshd-overlay-only
description: |
  Bascule sshd en écoute *uniquement* sur l'interface tailscale0 du
  host. Le port 22 sur les interfaces publiques devient injoignable
  côté ListenAddress ; un `pf-rule` block en complément pour défense
  en profondeur.

  Cette recette est *destructive* — si quelque chose tourne mal,
  l'opérateur peut perdre l'accès SSH au host. Trois garde-fous :

  1. `assert-tailscale-up` : refus catégorique si tailscale0 n'a pas
     d'IP ou si la session a moins de 30 s — on ne joue jamais cette
     recipe sur un host pas-encore-joint.
  2. Backup `/etc/ssh/sshd_config.before-overlay` posé avant
     modification — l'opérateur peut restaurer manuellement via
     console série si tout casse.
  3. DEAD-MAN'S-SWITCH : AVANT toute modif destructive, `auto-close-schedule`
     programme un `at +2 min` qui ré-applique `sshd-overlay-rollback`
     (ré-ouvre 22). Si l'opérateur perd l'accès après la bascule, 22 se
     ré-ouvre tout seul → pas de brick, même sans IPMI. Une fois l'overlay
     VÉRIFIÉ, l'opérateur annule le rollback avec :
         beryl apply --recipe sshd-overlay-commit <host> --transport=overlay
     (à lancer VIA l'overlay = preuve vivante que l'accès marche).

  Pré-requis impératifs :
  * le laptop opérateur doit déjà être dans le mesh Headscale (client
    Tailscale actif et joint) ;
  * le binaire `beryl` + sa config doivent être présents sur le host (le
    job `at` du rollback exécute `beryl apply` localement).

  Cf. memory ALOLI `roadmap_beryl_headscale.md` Phase 3a.

requires:
  - headscale-node

steps:
  - assert-tailscale-up:
      min_uptime_seconds: 30

  # DEAD-MAN'S-SWITCH — posé AVANT la bascule destructive : si l'opérateur
  # perd l'accès, `sshd-overlay-rollback` ré-ouvre 22 dans ~2 min. Annulé par
  # `sshd-overlay-commit` une fois l'overlay confirmé (sinon il se déclenche).
  - auto-close-schedule:
      tag: sshd-overlay-deadman
      after_minutes: 2
      recipe: sshd-overlay-rollback

  - sshd-config-set:
      key: ListenAddress
      value_from_command: "tailscale ip -4"

  - pf-rule:
      rule: "block in quick on egress proto tcp to port 22  # bloqué public, accessible uniquement via tailscale0"

  - service-enable:
      name: sshd
      start: true
