recipe: sshd-vrack-only
description: |
  Cache le port SSH (22) du PUBLIC : il n'est plus joignable que depuis le
  vRack (via un bastion z). Lève la non-conformité « port 22 exposé ».

  pf est default-pass → cette recette n'ajoute QUE le filtrage du 22 ; tous
  les autres services ET les connexions établies continuent. Règles (l'ordre
  `quick` = premier qui matche gagne, donc le pass AVANT le block) :

    pass  in quick inet proto tcp from <vrack_subnet> to port 22 flags any no state  # vRack OK (IPv4)
    block in quick      proto tcp            to port 22            # public KO (v4+v6)

  `flags any no state` : la session SSH DÉJÀ ouverte (celle de beryl, par le
  bastion) n'a pas d'état pf quand pf démarre. Avec l'état par défaut, seuls
  les paquets SYN passeraient la règle (la session tomberait sur le `block`) ;
  avec `flags any keep state`, l'état repris en cours de route ignore la
  mise à l'échelle de fenêtre TCP et pf finit par rejeter les paquets « hors
  fenêtre » : la session se fige au premier gros échange (vu sur ke le
  27 oct. 2026, ~2 min de blocage puis échec). Sans état, chaque paquet du
  vRack vers le 22 passe ; les réponses sortent par le « tout permis » de pf.
  Rechargé (`pfctl -f`) si pf tournait déjà avec d'autres règles : les états
  en cours sont gardés.

  Filtrage par SOUS-RÉSEAU vRack (pas par nom d'interface) → indépendant du
  matériel. L'IPv6 n'a pas de pass → tout l'IPv6:22 est bloqué (le vRack est
  IPv4). beryl possède /etc/pf.conf sur ces serveurs app cachés.

  ANTI-LOCKOUT — le routage vient du champ `bastion:` du host (pas de cette
  recette). Posez-le AVANT via `beryl vrack <host>` (choix « joindre via un
  bastion existant ») → écrit `bastion: <nom>` ; beryl en dérive ssh_host (= IP
  vRack) + proxy_jump (= user@<nom>.<domaine>) et joint donc le host PAR le
  bastion. Fermer le 22 public ne coupe alors pas la session. (>= beryl 0.5.77)

  ⚠️ PRÉ-REQUIS : le host doit DÉJÀ porter son IP vRack (`vrack-interface`
  appliquée lors d'un apply ANTÉRIEUR), avoir `bastion: <nom>` posé, et être
  joignable par le bastion. Sinon beryl REFUSE (uname vide) : appliquez d'abord
  `vrack-interface` seul, validez l'accès bastion, PUIS ajoutez `sshd-vrack-only`.

  Sur un host où pf TOURNE DÉJÀ (ex. bascule manuelle antérieure), le
  file-write met à jour /etc/pf.conf mais ne recharge pas pf à chaud →
  rechargez une fois : `sudo pfctl -f /etc/pf.conf` (ou au reboot,
  `pf_enable=YES` persiste). Sur un host neuf, `service pf start` charge et
  applique directement.
parameters:
  vrack_subnet:
    type: string
    default: "{{ vrack_subnet }}"
    description: "Sous-réseau vRack autorisé à joindre le port 22 (défaut : `vrack.subnet` du host)."
steps:
  - file-write:
      path: /etc/pf.conf
      mode: "0644"
      content: |
        # Généré par beryl (recette sshd-vrack-only). NE PAS éditer à la main.
        set skip on lo
        pass in quick inet proto tcp from {{ vrack_subnet }} to port 22 flags any no state
        block in quick proto tcp to port 22
  - service-enable:
      name: pf
      start: true
  # pf tournait déjà : `service-enable` ne recharge pas les règles. Garde :
  # la règle sans état du vRack est déjà chargée (seule de pf.conf en
  # `no state`).
  - command:
      run: "pfctl -f /etc/pf.conf"
      unless: "pfctl -sr 2>/dev/null | grep -q 'no state'"
