recipe: sshd-vrack-only
description: |
  Cache le port SSH (22) du PUBLIC : il n'est plus joignable que depuis le
  vRack (via un bastion z). Lève la non-conformité « port 22 exposé ».

  pf est default-pass → cette recette n'ajoute QUE le filtrage du 22 ; tous
  les autres services ET les connexions établies continuent. Règles (l'ordre
  `quick` = premier qui matche gagne, donc le pass AVANT le block) :

    pass  in quick inet proto tcp from <vrack_subnet> to port 22   # vRack OK (IPv4)
    block in quick      proto tcp            to port 22            # public KO (v4+v6)

  Filtrage par SOUS-RÉSEAU vRack (pas par nom d'interface) → indépendant du
  matériel. L'IPv6 n'a pas de pass → tout l'IPv6:22 est bloqué (le vRack est
  IPv4). beryl possède /etc/pf.conf sur ces serveurs app cachés.

  ANTI-LOCKOUT — beryl s'en charge via l'argument `bastion` :
   Invoquée avec `bastion` (ex. `- sshd-vrack-only: { bastion: zsbg }`), beryl
   ÉCRIT automatiquement, AVANT de se connecter, dans le `.host.yml` :
        ssh_host: <IP vRack du host>          # = vrack_ip (vrack-interface)
        proxy_jump: <user>@<bastion>.<domaine>
   …puis se (re)connecte PAR le bastion → fermer le 22 public ne coupe pas la
   session. (>= beryl 0.5.75)

  ⚠️ PRÉ-REQUIS : le host doit DÉJÀ porter son IP vRack (`vrack-interface`
  appliquée lors d'un apply ANTÉRIEUR) et être joignable par le bastion. Sinon
  beryl ne peut entrer par le vRack et REFUSE (uname vide) — appliquez d'abord
  `vrack-interface` seul, validez, PUIS ajoutez `sshd-vrack-only`. Sans
  `bastion`, beryl n'écrit rien : posez ssh_host/proxy_jump à la main.

  Sur un host où pf TOURNE DÉJÀ (ex. bascule manuelle antérieure), le
  file-write met à jour /etc/pf.conf mais ne recharge pas pf à chaud →
  rechargez une fois : `sudo pfctl -f /etc/pf.conf` (ou au reboot,
  `pf_enable=YES` persiste). Sur un host neuf, `service pf start` charge et
  applique directement.
parameters:
  vrack_subnet:
    type: string
    default: 192.168.42.0/24
    description: Sous-réseau vRack autorisé à joindre le port 22.
  bastion:
    type: string
    default: ""
    description: |
      Bastion z par lequel beryl rejoindra le host une fois caché. Déclenche
      l'écriture auto de ssh_host (= IP vRack) + proxy_jump dans le host.yml.
      Valeurs :
        - `auto`  → beryl déduit le z du MÊME datacentre depuis l'IP vRack
                    (chiffre des dizaines = DC : .31 → DC3 → z à .3). Recommandé.
        - `zsbg`  → nom court (→ `zsbg.<domaine>`) ou FQDN explicite.
        - vide    → beryl n'écrit rien (pose manuelle de ssh_host/proxy_jump).
steps:
  - file-write:
      path: /etc/pf.conf
      mode: "0644"
      content: |
        # Généré par beryl (recette sshd-vrack-only). NE PAS éditer à la main.
        set skip on lo
        pass in quick inet proto tcp from {{ vrack_subnet }} to port 22
        block in quick proto tcp to port 22
  - service-enable:
      name: pf
      start: true
