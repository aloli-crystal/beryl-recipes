recipe: tang-client
description: |
  Client Tang (`security/clevis-zfs`) : installe le binaire et le
  script rc.d `clevis_zfs` qui, au démarrage, reconstruit la clé des
  pools chiffrés en `encryption.mode: tang` en joignant les serveurs Tang
  (recette `tang-server`), puis les monte — sans opérateur.

  Cette recette ne fait QU'INSTALLER : l'enrôlement (clé du pool liée aux
  Tang, seuil K sur N) et l'activation au démarrage (`clevis_zfs_enable`,
  `clevis_zfs_datasets` dans `/etc/rc.conf`) sont l'affaire de
  `beryl tang-enroll <host> --apply`, une fois le pool créé par bootstrap.

  Ordre de mise en route d'un serveur chiffré :

    1. bloc `encryption:` (mode tang, urls, threshold) sur le pool dans la
       fiche du host ;
    2. `beryl bootstrap` : pool chiffré, clé locale sur le poste ;
    3. `beryl apply` (cette recette) ;
    4. `beryl tang-enroll <host> --apply` ;
    5. reboot de contrôle : le pool doit revenir monté seul.

  Les Tang doivent être joignables AU DÉMARRAGE (vRack posé par
  `vrack-interface` avant le script rc.d, qui suit NETWORKING). Si trop de
  Tang manquent, le pool reste verrouillé : `beryl unlock <host>` (clé du
  poste) prend le relais.
steps:
  - pkg-install:
      packages: [clevis-zfs]
