recipe: vrack-interface
description: |
  Configure l'interface privée vRack avec une IP statique. SÛR : ne touche
  QUE l'interface privée (`iface`) → l'interface publique n'est pas
  affectée, le host reste joignable normalement. C'est l'étape 1 du bastion
  vRack (avant tout basculement du sshd).

  `iface` vaut `auto` par défaut → beryl DÉTECTE le NIC vRack (la seule
  interface Ethernet `status: active` qui n'est PAS celle de la route par
  défaut = pas la publique ; le nom varie selon le matériel : ix1, ixl1,
  igb1, bce1…). Idempotent même quand l'IP vRack est déjà posée. Si la
  détection est ambiguë/vide, netif échoue → précisez `iface:` à la main.

  `ip` est OBLIGATOIRE et propre à chaque host → déclarez-le PAR host :

    # auto-détection du NIC (recommandé)
    apply_recipes:
      - vrack-interface: { ip: 192.168.42.1 }
    # NIC explicite (si auto échoue)
    apply_recipes:
      - vrack-interface: { ip: 192.168.42.11, iface: ixl1 }

  Pré-requis : le host doit être rattaché au vRack côté OVH (l'interface
  doit être `status: active`), sinon l'IP est posée mais sans connectivité.
parameters:
  iface:
    type: string
    default: auto
    description: Interface vRack (2ᵉ NIC sans IP publique). `auto` = détection.
  ip:
    type: string
    default: ""
    description: IP privée du host sur le vRack (obligatoire).
  netmask:
    type: string
    default: "255.255.255.0"
steps:
  - netif:
      iface: "{{ iface }}"
      ip: "{{ ip }}"
      netmask: "{{ netmask }}"
