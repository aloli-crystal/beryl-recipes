recipe: zfs-unlock-alert
description: |
  Alerte monit quand des données chiffrées attendent leur déverrouillage :
  pool non importé, clé non chargée ou dataset non monté (après un
  redémarrage, en mode `ssh_unlock` : la clé reste sur le poste de
  l'opérateur). Le mail dit quoi lancer (`unlock_command`, défaut
  `beryl unlock <fqdn> --apply`).

  UN MAIL = UNE ACTION : alerte au passage à « verrouillé » (donc peu après
  chaque démarrage, monit attendant 30 s), puis « succeeded » au
  déverrouillage. Contrôle à chaque cycle monit (une minute) : la demande
  part tout de suite.

  SMS en plus du mail quand la clé SMS d'OVH est dans le coffre
  (`OVH_SMS_CONSUMER_KEY`, recette `ovh-sms`, à déclarer aussi) : un SMS au
  passage à « verrouillé », en ASCII.

  Serveur à /home chiffré (profil standard) : monit ne démarre qu'APRÈS le
  déverrouillage (sa configuration est dans /usr/local/etc, chiffré), il ne
  peut donc pas prévenir d'un redémarrage subi (coupure, panic). Avec la
  clé SMS, `/etc/cron.d/zfs-unlock-boot` (en clair) lance au démarrage
  `zfs-unlock-check.sh --boot` : si monit n'a pas de configuration lisible,
  attente d'une minute (un `beryl reboot` déverrouille dans ce délai), puis
  SMS si les données sont toujours verrouillées (5 essais, une minute
  d'écart, le temps que le réseau monte).

  `datasets` : datasets chiffrés à surveiller, séparés par des espaces
  (ex. `zdata` ; un pool chiffré à la racine se nomme comme le pool ;
  /home chiffré : `zroot/encrypted zdata`).

  `restart_services` : services qui vivent sur ces données (base, site…),
  REDÉMARRÉS dans l'ordre donné au retour à « déverrouillé » : au boot, leur
  démarrage a échoué (données absentes), `start` ne suffit pas. Il ne reste
  qu'à lancer `beryl unlock`. Vide = rien n'est redémarré.

    apply_recipes:
      - zfs-unlock-alert: { datasets: zdata, restart_services: "mysql-server nginx" }
requires:
  - monit
parameters:
  datasets:
    type: string
    default: ""
    description: Datasets chiffrés surveillés, séparés par des espaces (obligatoire).
  restart_services:
    type: string
    default: ""
    description: Services redémarrés dans l'ordre au déverrouillage (ex. `mysql-server nginx`) ; vide = aucun.
  unlock_command:
    type: string
    default: "beryl unlock {{ fqdn }} --apply"
    description: Commande de déverrouillage rappelée dans l'alerte.
steps:
  - command:
      run: "echo 'zfs-unlock-alert : datasets obligatoire' >&2; exit 1"
      unless: "test -n '{{ datasets }}'"
  # exit 0 = tout est déverrouillé et monté ; exit 1 = alerte, avec la
  # raison et la commande à lancer (reprises dans le mail de monit).
  - file-write:
      path: /usr/local/sbin/zfs-unlock-check.sh
      mode: "0755"
      owner: "root:wheel"
      content: |
        #!/bin/sh
        # Géré par beryl (recette zfs-unlock-alert). `--sms` : envoie la
        # demande par SMS (action `exec` de monit, recette ovh-sms).
        # `--restart` : redémarre les services des données déverrouillées
        # (action `exec` de monit au retour à « déverrouillé »).
        if [ "${1:-}" = --sms ]; then
          [ -x /usr/local/sbin/ovh-sms ] || exit 0
          # Commande seule sur la dernière ligne : copiable telle quelle.
          exec /usr/local/sbin/ovh-sms "$(printf '%s : donnees chiffrees verrouillees. Deverrouiller :\n%s' '{{ fqdn }}' '{{ unlock_command }}')"
        fi
        if [ "${1:-}" = --boot ]; then
          # monit configuré (monitrc lisible) : c'est lui qui alerte.
          [ -r /usr/local/etc/monitrc ] && exit 0
          sleep 60
          "$0" >/dev/null 2>&1 && exit 0
          n=0
          until "$0" --sms >/dev/null 2>&1; do
            n=$((n + 1))
            [ "$n" -ge 5 ] && { logger -t zfs-unlock "SMS de déverrouillage NON envoyé (5 essais)"; exit 1; }
            sleep 60
          done
          logger -t zfs-unlock "données verrouillées au démarrage : SMS envoyé"
          exit 0
        fi
        if [ "${1:-}" = --restart ]; then
          rc=0
          for s in {{ restart_services }}; do
            if /usr/sbin/service "$s" restart >/dev/null 2>&1; then
              logger -t zfs-unlock "données déverrouillées : $s redémarré"
            else
              logger -t zfs-unlock "données déverrouillées : ÉCHEC du redémarrage de $s"
              rc=1
            fi
          done
          exit $rc
        fi
        rc=0
        for ds in {{ datasets }}; do
          pool=${ds%%/*}
          if ! zpool list -H -o name "$pool" >/dev/null 2>&1; then
            echo "$ds : pool $pool non importé (verrouillé)"
            rc=1
            continue
          fi
          ks=$(zfs get -H -o value keystatus "$ds" 2>/dev/null)
          if [ "$ks" != available ]; then
            echo "$ds : clé non chargée ($ks)"
            rc=1
            continue
          fi
          # canmount=off (encryptionroot `zroot/encrypted`) : jamais monté, la
          # clé chargée suffit.
          [ "$(zfs get -H -o value canmount "$ds" 2>/dev/null)" = off ] && continue
          if [ "$(zfs get -H -o value mounted "$ds" 2>/dev/null)" != yes ]; then
            echo "$ds : non monté"
            rc=1
          fi
        done
        if [ "$rc" -ne 0 ]; then
          echo "DÉVERROUILLAGE DEMANDÉ → {{ unlock_command }}"
        else
          echo "OK : données déverrouillées ({{ datasets }})"
        fi
        exit $rc
  - file-write:
      path: /usr/local/etc/monit.d/zfs-unlock.conf
      mode: "0644"
      owner: "root:wheel"
      unless_secret: OVH_SMS_CONSUMER_KEY
      content: |
        # Géré par beryl (recette zfs-unlock-alert). Inclus par monitrc.
        check program zfs-unlock with path "/usr/local/sbin/zfs-unlock-check.sh"
          with timeout 30 seconds
          if status != 0 then alert
            else if succeeded then exec "/usr/local/sbin/zfs-unlock-check.sh --restart"
  # Avec la clé SMS : même contrôle, action `exec` (SMS) au passage à
  # « verrouillé ». UNE seule règle : monit envoie un mail par action
  # déclenchée (`exec` compris), une règle `alert` en plus doublerait le mail.
  - file-write:
      path: /usr/local/etc/monit.d/zfs-unlock.conf
      mode: "0644"
      owner: "root:wheel"
      if_secret: OVH_SMS_CONSUMER_KEY
      content: |
        # Géré par beryl (recette zfs-unlock-alert). Inclus par monitrc.
        check program zfs-unlock with path "/usr/local/sbin/zfs-unlock-check.sh"
          with timeout 30 seconds
          if status != 0 then exec "/usr/local/sbin/zfs-unlock-check.sh --sms"
            else if succeeded then exec "/usr/local/sbin/zfs-unlock-check.sh --restart"
  # Alerte au démarrage, hors monit (cf. description) : cron lit
  # /etc/cron.d, en clair même quand /usr/local/etc est chiffré.
  - file-write:
      path: /etc/cron.d/zfs-unlock-boot
      mode: "0644"
      owner: "root:wheel"
      if_secret: OVH_SMS_CONSUMER_KEY
      content: |
        # Géré par beryl (recette zfs-unlock-alert). SMS si les données
        # chiffrées sont encore verrouillées une minute après le démarrage.
        @reboot root /usr/local/sbin/zfs-unlock-check.sh --boot
  - file-absent:
      path: /etc/cron.d/zfs-unlock-boot
      unless_secret: OVH_SMS_CONSUMER_KEY
  - service-reload:
      name: monit
      if_changed: true
      deferred: true
